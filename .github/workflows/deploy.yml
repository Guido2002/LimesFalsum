name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  # Queue successive pushes instead of cancelling the in-flight Pages
  # deploy. Cancelling mid-deploy is exactly what produced the repeated
  # "Error: Deployment cancelled" / endless "deployment_queued" failures.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build with Pages base path
        # The site is served at the custom domain root (limesfalsum.com, see
        # public/CNAME), so assets live at "/" — not at /<repo>/.
        run: npm run build
        env:
          BASE_URL: /

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Never let the status poller hang forever — cancel after 5 min.
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # v4 polls Pages status reliably; v5 can spin on a cancelled/queued
        # deployment. upload-pages-artifact@v4 pairs with deploy-pages@v4.
        uses: actions/deploy-pages@v4
        with:
          timeout: 240000
